# ADR-013 — le banc du montage de l'exemple gonfle l'activité sur
# JVM : même niveau que les bancs de vue (Robolectric exécute au
# plus le SDK 35, l'application compile contre le 36).
sdk=35
# Rendu natif (Skia) : les métriques de police deviennent réelles —
# la mesure qui décide du tracé, c'est la mesure de l'appareil.
graphicsMode=NATIVE
