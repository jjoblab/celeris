# CI de celeris — actions épinglées par somme SHA (ADR-011), wrapper
# validé, scripts de politique exécutés avec les motifs nominatifs lus
# dans le secret CELERIS_FORBIDDEN_REFS (jamais committés).
#
# Deux travaux : les modules purs (sans SDK Android — critère de sortie
# M1) et l'ensemble avec SDK (modules Android + démonstration).
name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  modules-purs:
    name: Modules purs (JVM, sans SDK Android)
    runs-on: ubuntu-latest
    env:
      CELERIS_FORBIDDEN_REFS: ${{ secrets.CELERIS_FORBIDDEN_REFS }}
      # Le runner préinstalle un SDK : le refus explicite prime sur la
      # détection (sinon les modules Android entraient en configuration
      # sans leurs composants — premier passage CI).
      CELERIS_SKIP_ANDROID: "1"
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: JDK 21 (Temurin)
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: 21
      - name: Gradle (validation du wrapper incluse)
        uses: gradle/actions/setup-gradle@7296c772c13d12d9871528814b51fb2143c138ef # v6.4.1
        with:
          validate-wrappers: true
      - name: Contrôles complets (politique + qualité des modules purs)
        run: ./gradlew check
      - name: Mutation (seuil 80 % dès la première ligne de production)
        run: ./gradlew :core-text:mutationThreshold
      - name: Publication locale (artefacts complets, SBOM, sommes de contrôle)
        run: ./gradlew publishToMavenLocal publicationChecksums
      - name: Fumée de la cli
        run: ./gradlew :cli:run

  android:
    name: Modules Android et démonstration
    runs-on: ubuntu-latest
    env:
      CELERIS_FORBIDDEN_REFS: ${{ secrets.CELERIS_FORBIDDEN_REFS }}
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: JDK 21 (Temurin)
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: 21
      - name: Gradle (validation du wrapper incluse)
        uses: gradle/actions/setup-gradle@7296c772c13d12d9871528814b51fb2143c138ef # v6.4.1
        with:
          validate-wrappers: true
      - name: Composants du SDK Android
        run: |
          if [ -z "${ANDROID_HOME:-}" ] && [ -z "${ANDROID_SDK_ROOT:-}" ]; then
            echo "SDK Android absent du runner : les modules Android ne seraient pas testés" >&2
            exit 1
          fi
          # sdkmanager n'est pas sur le PATH du runner : chemin complet.
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" --install "platforms;android-36" "build-tools;36.0.0" "platform-tools" > /dev/null
      - name: Contrôles complets (tous modules, SDK présent)
        run: ./gradlew check
      - name: Publication locale (onze artefacts — purs et Android, SBOM, sommes de contrôle)
        run: ./gradlew publishToMavenLocal publicationChecksums
      - name: Démonstration (APK debug)
        run: ./gradlew :demo:assembleDebug
      - name: APK de démonstration signé (porte)
        run: |
          APK=$(ls demo/build/outputs/apk/debug/*.apk)
          echo "APK examiné : $APK"
          test -s "$APK"
          # Le type debug signe par le magasin de clés de débogage du
          # runner : apksigner doit vérifier la signature, sinon la porte
          # échoue — un APK non signé ne traverse pas la CI.
          APKSIGNER="$ANDROID_HOME/build-tools/36.0.0/apksigner"
          "$APKSIGNER" verify --print-certs "$APK"
      - name: APK de démonstration (artefact)
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: demo-debug-apk
          path: demo/build/outputs/apk/debug/*.apk
          if-no-files-found: error

  # M7.5 (ADR-013) : les tests de vue (Robolectric) tournent à chaque
  # commit, vite — la couture Android↔modèles purs ne reste plus sans
  # preuve entre deux contrôles complets.
  view-tests:
    name: Tests de vue (Robolectric, JVM)
    runs-on: ubuntu-latest
    # Pas de CELERIS_SKIP_ANDROID ici : ce travail INSTALLE le SDK puis
    # exécute les tests de vue d'android-view et d'android-widgets —
    # le refus explicite exclurait ces modules du build et la sélection
    # de tâches échouerait (« project 'android-view' not found »).
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: JDK 21 (Temurin)
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: 21
      - name: Gradle (validation du wrapper incluse)
        uses: gradle/actions/setup-gradle@7296c772c13d12d9871528814b51fb2143c138ef # v6.4.1
        with:
          validate-wrappers: true
      - name: Composants du SDK Android
        run: |
          if [ -z "${ANDROID_HOME:-}" ] && [ -z "${ANDROID_SDK_ROOT:-}" ]; then
            echo "SDK Android absent du runner : les tests de vue ne tourneraient pas" >&2
            exit 1
          fi
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" --install "platforms;android-36" "build-tools;36.0.0" "platform-tools" > /dev/null
      - name: Tests de vue (Robolectric — gouttière, pincement, coloration, popups)
        run: |
          ./gradlew :android-view:testDebugUnitTest :android-widgets:testDebugUnitTest
      - name: Rapports de tests (artefact)
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: view-tests-reports
          path: |
            android-view/build/reports/tests/
            android-widgets/build/reports/tests/
          if-no-files-found: warn
