# Catalogue unique des versions — ADR-011. Toute version écrite en dur
# dans un module casse la CI ; toute montée passe par ici, puis par les
# tests de contrat. Versions vérifiées en ligne le 2026-11-04.

[versions]
# Chaîne de build (ADR-001) — Gradle est épinglé par le wrapper (somme de
# contrôle dans gradle/wrapper/gradle-wrapper.properties).
agp = "9.5.0"
# Qualité (ADR-002 : plafonds ; ADR-009 : nullité ; ADR-010 : mutation)
checkstyle = "14.4.0"
pmd = "7.29.0"
errorprone = "2.52.0"
errorpronePlugin = "5.2.0"
nullaway = "0.14.3"
jspecify = "1.0.1"
jacoco = "0.8.16"
archunit = "1.5.1"
# Tests (ADR-010)
junitJupiter = "6.1.3"
jqwik = "1.10.2"
pitest = "1.30.1"
pitestJunit5 = "1.2.3"
# Tests de vue sur JVM (ADR-013 — vérifiées sur Maven Central le
# 2026-11-08) : Robolectric se pilote par son lanceur JUnit 4, porté
# sur la plateforme Jupiter par le moteur vintage (même version que
# Jupiter, alignement du train de tests).
junit4 = "4.13.2"
robolectric = "4.15.1"
# Étage SDK des tests de vue (ADR-013) : Robolectric télécharge le jar
# android-all au premier démarrage du test, par HTTP direct et sans
# reprise — un bridage transitoire de Maven Central (429 observé le
# 2026-11-08, en CI comme en local) suffit à faire tomber TOUTE la suite
# (initializationError sur chaque classe). Le jar est donc résolu par
# Gradle (configuration sdkRobolectric de la convention Android : reprises
# configurées, cache partagé) et la tâche robolectricDeps oriente
# Robolectric vers le jar du cache — plus aucun réseau au démarrage du
# test. Littéral aligné sur robolectric.properties (sdk=35) et
# Robolectric 4.15.1 — vérifié sur Maven Central le 2026-11-08.
robolectricAndroidAll = "15-robolectric-12650502-i7"
# Publication (ADR-011 : SBOM)
cyclonedx = "3.5.1"
# Version de l'application de démonstration (non publiée) — toute
# version vit au catalogue ; l'APK doit porter versionCode et
# versionName, sinon certains installateurs refusent le paquet.
demo = "0.1.0"
# Interface de la démonstration (M3 — vérifiées sur Google Maven le
# 2026-11-06, compatibles compileSdk 36)
androidxActivity = "1.12.0"
androidxAppcompat = "1.8.0"
androidxCore = "1.18.0"
androidxRecyclerview = "1.4.0"
material = "1.14.0"
# Désucrage des bibliothèques du cœur (M8.6) : le serveur XML embarqué
# touche les API Java 11 (List.of, String.strip) au-delà du niveau 26 —
# vérifiée sur Google Maven le 2026-11-08.
desugarJdkLibs = "2.1.5"
# Moteur d'expressions rationnelles des grammaires TextMate (M7.6,
# ADR-014) : portage Java d'Oniguruma, sémantique de référence du
# format — vérifiées sur Maven Central le 2026-11-09 (POM MIT lus).
joni = "2.2.9"
jcodings = "1.0.64"
# Client LSP sur bibliothèque (M7.6, ADR-015) : le protocole et le
# JSON-RPC viennent de la bibliothèque derrière la frontière
# lsp-protocole — licence EPL-2.0 OU BSD-3-Clause (consommable sous
# BSD-3-Clause, compatible Apache-2.0), arbre réduit à gson seul —
# vérifiées sur Maven Central le 2026-11-09 (POM lus au spike).
lsp4j = "1.0.0"
# La copie unique de Gson (ADR-015, décision 3) : la version que le
# serveur XML embarqué apporte déjà, dans l'intervalle exigé par la
# bibliothèque — vérifiée sur Maven Central le 2026-11-09.
gson = "2.10.1"

[libraries]
# Dépendances de test (modules purs et Android)
junit-jupiter = { module = "org.junit.jupiter:junit-jupiter", version.ref = "junitJupiter" }
# Sans version : aligné sur la plateforme entraînée par junit-jupiter.
junit-platform-launcher = { module = "org.junit.platform:junit-platform-launcher" }
jqwik = { module = "net.jqwik:jqwik", version.ref = "jqwik" }
archunit-junit5 = { module = "com.tngtech.archunit:archunit-junit5", version.ref = "archunit" }
# Rendu de vue sur JVM (ADR-013) : Robolectric porte son lanceur JUnit 4
# (aucune extension Jupiter officielle à ce jour), le moteur vintage le
# fait rouler sur la plateforme Jupiter commune au dépôt.
junit4 = { module = "junit:junit", version.ref = "junit4" }
junit-vintage = { module = "org.junit.vintage:junit-vintage-engine", version.ref = "junitJupiter" }
robolectric = { module = "org.robolectric:robolectric", version.ref = "robolectric" }
# Jar android-all du SDK des tests (voir la note de robolectricAndroidAll
# ci-dessus) : testImplementation, jamais dans les artefacts publiés.
robolectric-android-all = { module = "org.robolectric:android-all-instrumented", version.ref = "robolectricAndroidAll" }
# Nullité en surface d'API (ADR-009) — annotations JSpecify
jspecify = { module = "org.jspecify:jspecify", version.ref = "jspecify" }
# Analyse statique javac (ADR-009 : Error Prone + NullAway)
errorprone-core = { module = "com.google.errorprone:error_prone_core", version.ref = "errorprone" }
nullaway = { module = "com.uber.nullaway:nullaway", version.ref = "nullaway" }
# Mutation (ADR-010) — exécutée par la tâche dédiée de build-logic
# (l'artefact de ligne de commande entraîne le cœur de PIT).
pitest-cli = { module = "org.pitest:pitest-command-line", version.ref = "pitest" }
pitest-junit5 = { module = "org.pitest:pitest-junit5-plugin", version.ref = "pitestJunit5" }
# Interface de la démonstration — la seule dépendance externe du dépôt
# hors chaîne de build et de test ; la démo n'est pas publiée (ADR-011).
androidx-activity = { module = "androidx.activity:activity", version.ref = "androidxActivity" }
androidx-appcompat = { module = "androidx.appcompat:appcompat", version.ref = "androidxAppcompat" }
androidx-core = { module = "androidx.core:core", version.ref = "androidxCore" }
androidx-recyclerview = { module = "androidx.recyclerview:recyclerview", version.ref = "androidxRecyclerview" }
google-material = { module = "com.google.android.material:material", version.ref = "material" }
# Désucrage du cœur (M8.6) — les API Java 11 du serveur XML embarqué
# au-dessus du niveau 26 (List.of, String.strip).
desugar-jdk-libs = { module = "com.android.tools:desugar_jdk_libs", version.ref = "desugarJdkLibs" }
# Moteur des expressions des grammaires TextMate (M7.6, ADR-014) : joni,
# portage Java d'Oniguruma — la sémantique que le format suppose — et son
# rouage d'encodages (UTF-8 seul sert). Première dépendance tierce du
# RUNTIME d'un artefact publié : SBOM, NOTICE et REFERENCES la couvrent.
joni = { module = "org.jruby.joni:joni", version.ref = "joni" }
jcodings = { module = "org.jruby.jcodings:jcodings", version.ref = "jcodings" }
# Le protocole LSP derrière la frontière `lsp-protocole` (ADR-015) :
# dépendance interne du module — aucun type de la bibliothèque ne
# paraît dans son API (implementation, comme joni) ; SBOM, NOTICE et
# REFERENCES la couvrent (règle 5).
lsp4j = { module = "org.eclipse.lsp4j:org.eclipse.lsp4j", version.ref = "lsp4j" }
# Épinglée STRICTEMENT : l'intervalle de la bibliothèque laisse flotter
# la version, la copie unique avec le serveur exige la maîtrise de
# l'octet (ADR-015, décision 3).
gson = { module = "com.google.code.gson:gson", version.ref = "gson" }
# Artefacts de plugin résolus par build-logic (aucun plugin appliqué par
# identifiant hors des conventions) :
android-gradlePlugin = { module = "com.android.tools.build:gradle", version.ref = "agp" }
errorprone-gradlePlugin = { module = "net.ltgt.errorprone:net.ltgt.errorprone.gradle.plugin", version.ref = "errorpronePlugin" }
cyclonedx-gradlePlugin = { module = "org.cyclonedx.bom:org.cyclonedx.bom.gradle.plugin", version.ref = "cyclonedx" }

[plugins]
# Appliqués par les modules via alias (génère les accesseurs typés du
# bloc android {} dans le script du module) ; les conventions
# celeris.android-* portent les réglages communs.
android-library = { id = "com.android.library", version.ref = "agp" }
android-application = { id = "com.android.application", version.ref = "agp" }
