# ADR-013 — Robolectric 4.15 exécute au plus le SDK 35 (le module
# compile contre le 36) : toutes les classes de test de vue s'y fixent,
# sans annotation par classe.
sdk=35
# Rendu natif (Skia) : les métriques de police deviennent réelles — la
# mesure qui décide du tracé, c'est la mesure de l'appareil (PIEGE-22).
graphicsMode=NATIVE
